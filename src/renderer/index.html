<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>beeCode</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <!-- Drag grips for the two side columns. Absolutely positioned, so they are never
           grid items of their own (see renderer/columns.ts). -->
      <div class="col-resizer resizer-rail" id="resizer-rail" role="separator" tabindex="0"
           aria-orientation="vertical" aria-label="Resize the navigation column"></div>
      <!-- The way back when a side column is collapsed: a slim handle pinned to the
           window edge, so it does not move when the column it belongs to disappears. -->
      <button type="button" class="col-reveal reveal-rail" id="reveal-rail" hidden
              title="Show the navigation column" aria-label="Show the navigation column">&raquo;</button>
      <button type="button" class="col-reveal reveal-panel" id="reveal-panel" hidden
              title="Show the side panel" aria-label="Show the side panel">&laquo;</button>

      <aside class="rail" id="rail">
        <div class="rail-head">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <div>
              <div class="brand-name">beeCode</div>
              <div class="brand-sub">agentic desktop</div>
            </div>
          </div>
          <button id="new-session" class="btn ghost small" title="New session (Ctrl+N)">＋</button>
        </div>
        <div class="rail-section-label">Sessions</div>
        <div class="session-list" id="session-list"></div>
        <div class="rail-foot">
          <div class="status" id="service-status">
            <span class="dot" id="service-dot"></span>
            <span id="service-text">connecting…</span>
          </div>
          <button id="restart-service" class="btn ghost small" title="Restart the agent service">⟳</button>
        </div>
      </aside>

      <main class="workspace">
        <!-- First-run setup. It covers the column until a workspace folder exists: the
             agent never roots itself in the directory the app was installed in. -->
        <section class="workspace-gate hidden" id="workspace-gate" aria-label="Workspace setup"></section>

        <header class="topbar">
          <div class="topbar-title">
            <h1 id="session-title">New session</h1>
            <button type="button" class="cwd" id="session-cwd" title="Change the working directory of this session"></button>
          </div>
          <div class="topbar-controls">
            <button type="button" id="workspace-btn" class="btn ghost small" title="Switch workspace">⌂</button>
            <label class="field">
              <span>mode</span>
              <select id="mode-select">
                <option value="ask">ask</option>
                <option value="plan">plan</option>
                <option value="act">act</option>
                <option value="autonomous">autonomous</option>
              </select>
            </label>
            <label class="field">
              <span>model</span>
              <select id="model-select"></select>
            </label>
            <button type="button" id="toggle-rail" class="btn ghost small" aria-pressed="true"
                    title="Hide the navigation column">&laquo;</button>
            <button type="button" id="toggle-panel" class="btn ghost small" aria-pressed="true"
                    title="Hide the side panel">&raquo;</button>
            <button type="button" id="toggle-terminal" class="btn ghost small" aria-pressed="false"
                    title="Show or hide the workspace terminal (Ctrl+&#96;)">&gt;_</button>
            <button type="button" id="open-settings" class="btn ghost small"
                    title="Settings: models, integrations and scheduled runs (Ctrl+,)">⚙</button>
          </div>
        </header>

        <!-- Main-area tabs: the chat, one rendered document per open tab, and the embedded
             browser. The pane and the dock sit above the composer, so a page view can never
             cover the input. The strip stays hidden until there is something to switch to. -->
        <nav class="view-tabs" id="view-tabs" role="tablist" aria-label="Main area views" hidden></nav>
        <section class="doc-pane" id="doc-pane" hidden></section>

        <section class="transcript" id="transcript" aria-live="polite"></section>

        <!-- Reserves the rectangle the main process paints the sandboxed page view into.
             The chrome inside is plain renderer DOM; the page never renders here. -->
        <section class="browser-dock hidden" id="browser-dock" aria-label="Internal browser"></section>

        <div class="question-slot" id="question-slot"></div>
        <div class="approval-slot" id="approval-slot"></div>

        <!-- Goal + to-do plan, hidden while the feature is off or nothing is planned. -->
        <div class="goal-slot" id="goal-slot"></div>

        <form class="composer" id="composer">
          <!-- Attachments chips: filled by the renderer, one row per attached file. -->
          <div class="composer-attachments hidden" id="composer-attachments"></div>
          <!-- The controls float inside the input box: no extra row in the chat area. -->
          <div class="composer-box">
            <textarea
              id="input"
              rows="1"
              placeholder="Describe what to do on the desktop…  (Enter to send, Shift+Enter for a new line)"
            ></textarea>
            <div class="composer-tools">
              <button type="button" id="attach" class="tool-btn" title="Attach files to this prompt" aria-label="Attach files">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.1 12.2 20.3a5.9 5.9 0 0 1-8.4-8.4l9.2-9.2a3.9 3.9 0 0 1 5.6 5.6l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
              </button>
              <span class="spacer"></span>
              <button type="button" id="stop" class="tool-btn danger hidden" title="Stop the running turn" aria-label="Stop">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.6"/></svg>
              </button>
              <button type="submit" id="send" class="tool-btn primary" title="Send (Enter)" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m5.5 11.5 6.5-6.5 6.5 6.5"/></svg>
              </button>
            </div>
          </div>
          <span class="hint" id="composer-hint"></span>
        </form>

        <!-- A terminal is a work surface, not session state: it takes the bottom of the chat
             column (where there is width for it) and folds away from its own header. -->
        <section class="drawer hidden" id="drawer" aria-label="Workspace terminal">
          <div class="drawer-body" id="drawer-body"></div>
        </section>
      </main>

      <aside class="panel" id="panel">
        <div class="panel-tabs" role="tablist">
          <button class="tab active" data-panel="subagents" role="tab">Subagents</button>
          <button class="tab" data-panel="activity" role="tab">Activity</button>
          <button class="tab" data-panel="explorer" role="tab">Files</button>
        </div>
        <div class="panel-body" id="panel-body"></div>
      </aside>
      <div class="col-resizer resizer-panel" id="resizer-panel" role="separator" tabindex="0"
           aria-orientation="vertical" aria-label="Resize the side panel column"></div>
    </div>

    <!-- Configuration belongs to the app, not to a session, so it lives behind the gear
         instead of competing for space with the session's own tabs. -->
    <div class="modal-backdrop hidden" id="settings-modal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <header class="modal-head">
          <h2 id="settings-title">Settings</h2>
          <button type="button" id="close-settings" class="btn ghost small"
                  title="Close settings (Esc)">✕</button>
        </header>
        <div class="modal-main">
          <nav class="modal-nav" id="settings-nav" aria-label="Settings sections">
            <button type="button" class="modal-nav-item active" data-settings="general">General</button>
            <button type="button" class="modal-nav-item" data-settings="tools">Tools</button>
            <button type="button" class="modal-nav-item" data-settings="permissions">Permissions</button>
            <button type="button" class="modal-nav-item" data-settings="integrations">MCP &amp; skills</button>
            <button type="button" class="modal-nav-item" data-settings="automation">Scheduled runs</button>
          </nav>
          <div class="modal-body" id="settings-body"></div>
        </div>
      </div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
