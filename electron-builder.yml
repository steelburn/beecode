appId: com.beecode.desktop
productName: beeCode
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - resources/**/*
  # The vendored Python runtime cannot be executed from inside the asar, so it is kept out
  # of the archive and copied next to it by extraResources below.
  - "!resources/python/**"
  - "!resources/.cache/**"
  - package.json
extraResources:
  - from: resources/python
    to: python
    filter:
      - "**/*"
extraMetadata:
  main: dist/main.js
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: beeCode
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: resources/icon.png
linux:
  target:
    - AppImage
  category: Development
  icon: resources/icon.png
